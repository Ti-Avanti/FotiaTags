# 中文语言文件

prefix: "<gray>[<gold>FotiaTags</gold>]</gray> "

# 成功消息
tag-given: "<green>成功给予 <white>{player}</white> 称号 <white>{tag}</white>，时长: <white>{duration}</white>"
tag-removed: "<green>成功移除 <white>{player}</white> 的称号 <white>{tag}</white>"
tag-set: "<green>成功设置 <white>{player}</white> 的当前称号为 <white>{tag}</white>"
tag-cleared: "<green>成功清除 <white>{player}</white> 的当前称号"
config-reloaded: "<green>配置已重载"
export-success: "<green>成功导出 <white>{count}</white> 个称号到 <white>{file}</white>"
export-failed: "<red>导出失败: <white>{error}</white>"
import-success: "<green>成功导入 <white>{count}</white> 个称号（覆盖 <white>{overwritten}</white> 个）"
import-replace-success: "<green>成功导入 <white>{count}</white> 个称号（覆盖 <white>{overwritten}</white> 个，删除 <white>{deleted}</white> 个）"
import-file-not-found: "<red>找不到导入文件: <white>{file}</white>"
import-empty: "<red>导入文件中没有称号数据"

# 玩家消息
your-tag-set: "<green>你的称号已设置为 <white>{tag}</white>"
your-tag-cleared: "<green>你的称号已清除"
your-tag-expired: "<yellow>你的称号 <white>{tag}</white> 已过期"
tag-received: "<green>你获得了称号 <white>{tag}</white>，时长: <white>{duration}</white>"
tag-lost: "<yellow>你的称号 <white>{tag}</white> 已被移除"
custom-tag-created: "<green>自定义称号购买成功，已加入称号仓库"
custom-tag-saved: "<green>自定义称号已保存"
custom-tag-locked: "<red>自定义称号购买后只能设置一次，不能再次修改"
custom-tag-deleted: "<green>自定义称号已删除"
custom-tag-refunded: "<green>已返还 <white>{amount}</white> <white>{provider}</white>"
custom-tag-input-prefix: "<yellow>请在聊天栏输入新的称号前缀，输入 <white>cancel</white> 取消"
custom-tag-input-suffix: "<yellow>请在聊天栏输入新的称号后缀，输入 <white>cancel</white> 取消"
custom-tag-input-cancelled: "<gray>已取消输入"
custom-tag-part-disabled: "<red>管理员已关闭这个自定义称号内容的设置"

# 错误消息
no-permission: "<red>你没有权限执行此操作"
player-not-found: "<red>找不到玩家 <white>{player}</white>"
player-not-online: "<red>玩家 <white>{player}</white> 不在线"
tag-not-found: "<red>找不到称号 <white>{tag}</white>"
already-has-tag: "<red>玩家 <white>{player}</white> 已拥有称号 <white>{tag}</white>"
not-own-tag: "<red>玩家 <white>{player}</white> 未拥有称号 <white>{tag}</white>"
invalid-duration: "<red>无效的时长格式: <white>{duration}</white>"
database-error: "<red>数据库操作失败，请查看控制台"
custom-tag-disabled: "<red>自定义称号功能未开启"
custom-tag-not-purchased: "<red>你还没有购买自定义称号"
custom-tag-incomplete: "<red>请先设置启用的内容并选择图标"
custom-tag-invalid-icon: "<red>无效的自定义称号图标"
custom-tag-too-long: "<red>内容过长，最多允许 <white>{max}</white> 个字符"
custom-tag-empty: "<red>内容不能为空"
custom-tag-colors-denied: "<red>当前配置不允许使用颜色代码"
custom-tag-minimessage-denied: "<red>当前配置不允许使用MiniMessage标签"
custom-tag-blocked-word: "<red>自定义称号包含违禁词，请重新输入"
custom-tag-limit-reached: "<red>你拥有的自定义称号数量已达到上限 <white>{max}</white>"
custom-tag-delete-disabled: "<red>管理员已关闭玩家自删自定义称号功能"
custom-tag-delete-failed: "<red>自定义称号删除失败，请稍后重试"
custom-tag-refund-failed: "<red>自定义称号已删除，但退款失败，请联系管理员"
custom-tag-payment-unavailable: "<red>支付插件不可用，请联系管理员"
custom-tag-insufficient-funds: "<red>余额不足，需要 <white>{price}</white>"
custom-tag-purchase-failed: "<red>购买失败，请稍后重试"
custom-tag-save-failed: "<red>自定义称号保存失败，请稍后重试"

# 列表
tag-list-header: "<gold>===== 称号列表 ====="
tag-list-item: "<gray>- <white>{tag}</white> <gray>({expire})"
tag-list-footer: "<gold>共 <white>{count}</white> 个称号"
tag-list-empty: "<gray>暂无称号"
admin-player-list-load-failed: "<red>加载玩家列表失败，请查看控制台"
admin-player-tags-load-failed: "<red>加载玩家 <white>{player}</white> 的称号失败，请稍后重试"
admin-player-tags-save-failed: "<red>保存玩家 <white>{player}</white> 的称号失败，请稍后重试"
admin-player-tag-selected: "<green>已为 <white>{player}</white> 佩戴称号 <white>{tag}</white>"
admin-player-tag-cleared: "<green>已清空 <white>{player}</white> 的当前称号"
admin-player-tag-removed: "<green>已移除 <white>{player}</white> 的称号 <white>{tag}</white>"
admin-player-custom-tag-removed: "<green>已删除 <white>{player}</white> 的自定义称号"

# 时长显示
duration-permanent: "永久"
duration-format: "{days}天{hours}小时{minutes}分钟"
duration-expired: "已过期"
duration-day: "天"
duration-hour: "小时"
duration-minute: "分钟"
duration-second: "秒"
duration-separator: ""

# 帮助
help-header: "<gold>===== FotiaTags 帮助 ====="
help-give: "<yellow>/ft give <玩家> <称号> [时长] <gray>- 给予称号"
help-remove: "<yellow>/ft remove <玩家> <称号> <gray>- 移除称号"
help-set: "<yellow>/ft set <玩家> <称号> <gray>- 设置当前称号"
help-list: "<yellow>/ft list [玩家] <gray>- 查看称号列表"
help-menu: "<yellow>/ft menu <gray>- 打开称号菜单"
help-custom: "<yellow>/ft custom <gray>- 打开自定义称号菜单"
help-reload: "<yellow>/ft reload <gray>- 重载配置"
help-editor: "<yellow>/ft editor <gray>- 打开称号编辑器"
help-players: "<yellow>/ft players <gray>- 管理玩家拥有的称号"
help-export: "<yellow>/ft export <gray>- 导出称号配置"
