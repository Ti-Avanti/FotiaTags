# 管理员称号粒子选择菜单

# 可用变量:
# %tag_id% 称号ID
# %tag_name% 显示名
# %tag_particle% 当前绑定的粒子模板ID
# %particle_id% 粒子模板ID
# %particle_name% 粒子模板显示名
# %particle_selected% 是否已选择
title: "<gold><!i>选择粒子效果: %tag_name%"
size: 54

# 布局说明:
# X = 边框
# B = 返回编辑菜单
# 空格 = 空槽位
# 粒子模板物品会按 particle-slots 填充，优先覆盖布局里的物品。
layout:
  - "XXXXXXXXX"
  - "X       X"
  - "X       X"
  - "X       X"
  - "X       X"
  - "BXXXXXXXX"

items:
  X:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    lore: []

  B:
    material: ARROW
    name: "<yellow><!i>返回编辑菜单"
    lore:
      - "<gray>点击返回称号编辑菜单"
    action: back_to_edit

# 粒子模板显示槽位，第一个槽位会显示“不设置粒子”
particle-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34

no-particle-item:
  material: BARRIER
  name: "<red><!i>不设置粒子"
  lore:
    - "<gray>状态: %particle_selected%"
    - ""
    - "<yellow>点击清空粒子效果"
  action: clear_particle

particle-item:
  material: BLAZE_POWDER
  name: "<white><!i>%particle_name%"
  lore:
    - "<gray>ID: <yellow>%particle_id%"
    - "<gray>状态: %particle_selected%"
    - ""
    - "<yellow>点击绑定此粒子"
  action: select_particle
