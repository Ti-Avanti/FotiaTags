name: FotiaTags
version: ${project.version}
main: gg.fotia.tags.FotiaTags
api-version: '1.20'
author: Fotia
description: 称号系统插件，支持跨服同步、多语言、GUI管理
softdepend:
  - BasicTool
  - PlaceholderAPI
  - Vault
  - PlayerPoints
libraries:
  - org.xerial:sqlite-jdbc:3.45.3.0
  - com.mysql:mysql-connector-j:8.4.0

commands:
  fotiatags:
    description: FotiaTags主命令
    aliases: [ftags, tags, tag, ft]
    usage: /fotiatags <subcommand>

permissions:
  fotiatags.use:
    description: 允许使用称号菜单
    default: true
  fotiatags.admin:
    description: 管理员权限
    default: op
  fotiatags.admin.give:
    description: 给予玩家称号
    default: op
  fotiatags.admin.remove:
    description: 移除玩家称号
    default: op
  fotiatags.admin.set:
    description: 设置玩家当前称号
    default: op
  fotiatags.admin.list:
    description: 查看玩家称号列表
    default: op
  fotiatags.admin.reload:
    description: 重载插件配置
    default: op
  fotiatags.admin.editor:
    description: 使用称号编辑器
    default: op
  fotiatags.admin.players:
    description: 管理玩家拥有的称号
    default: op
  fotiatags.admin.export:
    description: 导出称号配置
    default: op
  fotiatags.admin.import:
    description: 导入称号配置
    default: op
  fotiatags.custom:
    description: 使用自定义称号功能
    default: true
  fotiatags.effects:
    description: 使用动态效果仓库和商店
    default: true
  fotiatags.admin.effect:
    description: 管理玩家的动态称号效果
    default: op
