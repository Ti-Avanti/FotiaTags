# 称号定义
# 每个称号包含以下属性:
# - display-name: 显示名称
# - prefix: 前缀（MiniMessage格式）
# - suffix: 后缀（MiniMessage格式）
# - prefix2: 前缀（PAPI变量格式，用于不支持MiniMessage的地方）
# - suffix2: 后缀（PAPI变量格式）
# - permission: 权限节点（可选）
# - material: GUI物品材质（默认PAPER）
# - item-model: 物品模型（1.21+，可选）
# - custom-model-data: 自定义模型数据（可选）

