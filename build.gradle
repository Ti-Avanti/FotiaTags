plugins {
    id 'java'
}

group = 'gg.fotia'
version = '1.1.2'

def paperApiVersion = providers.gradleProperty('paperApiVersion').getOrElse('1.21.4-R0.1-SNAPSHOT')

configurations {
    basicToolBridge {
        transitive = false
    }
    compileOnly.extendsFrom basicToolBridge
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(paperApiVersion.tokenize('.')[0].toInteger() >= 26 ? 25 : 21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.rosewooddev.io/repository/public/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    basicToolBridge 'gg.fotia:basictool-bridge:1.0.0-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        exclude group: 'org.bukkit'
        exclude group: 'org.spigotmc'
    }
    compileOnly('org.black_ixx:playerpoints:3.2.7') {
        exclude group: 'org.bukkit'
        exclude group: 'org.spigotmc'
    }

    compileOnly 'org.xerial:sqlite-jdbc:3.45.3.0'
    compileOnly 'com.mysql:mysql-connector-j:8.4.0'

    testImplementation "io.papermc.paper:paper-api:${paperApiVersion}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', version
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand version: version, project: [version: version]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    from({ configurations.basicToolBridge.collect { zipTree(it) } }) {
        include 'gg/fotia/basictool/bridge/**'
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
